name: web-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: web vitest + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (API backend for e2e)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg and Playwright OS dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m playwright install --with-deps chromium

      - name: Install Playwright browsers (web e2e)
        run: |
          set -euo pipefail
          which -a playwright || true
          if [ ! -x ./node_modules/.bin/playwright ]; then
            echo "Playwright bin missing in apps/web/node_modules/.bin; re-linking workspace deps"
            ls -la node_modules/.bin || true
            pnpm --dir ../.. install --frozen-lockfile --force
          fi
          ./node_modules/.bin/playwright --version
          ./node_modules/.bin/playwright install chromium
        working-directory: apps/web

      - name: Web typecheck and production build
        run: pnpm build
        working-directory: apps/web

      - name: API lint
        run: ruff check --select F821 hinaa_api tests
        working-directory: apps/api

      - name: API tests
        run: pytest
        working-directory: apps/api

      - name: Web lint
        run: pnpm lint
        working-directory: apps/web

      - name: Unit tests (vitest)
        run: pnpm test
        working-directory: apps/web

      - name: E2E tests (Playwright, mock provider — no API keys required)
        run: pnpm test:e2e
        working-directory: apps/web
        env:
          HINAA_PROVIDER_MODE: mock

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
