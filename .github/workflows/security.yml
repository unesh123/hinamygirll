name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Known advisories exist (see docs/operations.md); report without blocking
    # until they are triaged, then drop continue-on-error to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install API dependencies
        run: pip install -r apps/api/requirements-dev.txt
      - name: Audit installed environment
        run: pip-audit --local --progress-spinner off

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  docker-build:
    name: docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
