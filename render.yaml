services:
  - type: web
    name: hinaa-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HINAA_PROVIDER_MODE
        value: real
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_PLANNER_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CODE_CRAFT_API_KEY
        sync: false
      - key: HINAA_DATABASE_URL
        sync: false
