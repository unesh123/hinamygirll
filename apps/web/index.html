<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0710" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="HINAA — Your intelligent AI workspace. Voice, text, research, and tools."
    />
    <title>HINAA — AI Workspace</title>

    <!-- Air Style Typography: Inter (Control/TNT), Anton (Control Compressed 900), Caveat (Control Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@400;500;600;700&family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!--
      Theme sync: applies the saved theme before first paint to prevent flash.
      Air default is dark ("midnight sky through glass sculpture").
    -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("hinaa_settings_v1") || "{}");
          var theme = (s.appearance && s.appearance.theme) || "dark";
          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
